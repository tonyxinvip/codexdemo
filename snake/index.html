<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07110e" />
    <meta
      name="description"
      content="一款适配键盘与触屏的现代贪吃蛇小游戏。"
    />
    <title>贪吃蛇 · SNAKE 01</title>
    <link rel="stylesheet" href="./styles.css?v=0.1.0" />
  </head>
  <body>
    <div class="page-glow page-glow--one" aria-hidden="true"></div>
    <div class="page-glow page-glow--two" aria-hidden="true"></div>

    <main class="app-shell">
      <header class="topbar">
        <a class="wordmark" href="../" aria-label="返回 Demo 索引">
          <span class="wordmark__mark" aria-hidden="true"><i></i><i></i><i></i></span>
          <span>SNAKE<span class="wordmark__slash">//</span>01</span>
        </a>
        <div class="topbar__meta">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="live-status" role="status" aria-live="polite">等待开始</span>
        </div>
      </header>

      <section class="game-layout" aria-labelledby="game-title">
        <aside class="game-info">
          <div>
            <p class="eyebrow">经典模式 · CLASSIC</p>
            <h1 id="game-title">贪吃蛇</h1>
            <p class="lede">保持移动，吃下能量点。<br />别撞墙，也别撞到自己。</p>
          </div>

          <div class="scoreboard" aria-label="游戏分数">
            <div class="score-card score-card--active">
              <span>当前得分</span>
              <strong id="score">00</strong>
            </div>
            <div class="score-card">
              <span>最佳记录</span>
              <strong id="best-score">00</strong>
            </div>
            <div class="score-card score-card--wide">
              <span>速度等级</span>
              <div class="speed-meter" id="speed-meter" aria-label="速度等级 1">
                <i class="is-on"></i><i></i><i></i><i></i><i></i>
              </div>
            </div>
          </div>

          <div class="desktop-actions">
            <button class="button button--primary" id="primary-action" type="button">
              <span id="primary-action-label">开始游戏</span>
              <span aria-hidden="true">↗</span>
            </button>
            <button class="button button--ghost" id="restart-action" type="button">重新开始</button>
          </div>

          <div class="key-guide" aria-label="键盘操作说明">
            <div class="key-guide__keys" aria-hidden="true">
              <span></span><kbd>↑</kbd><span></span>
              <kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd>
            </div>
            <p>方向键 / WASD<br /><span>空格暂停 · 回车开始</span></p>
          </div>
        </aside>

        <div class="play-column">
          <div class="arena-frame" id="arena-frame">
            <div class="arena-corners" aria-hidden="true"></div>
            <canvas
              id="game-canvas"
              width="720"
              height="720"
              role="img"
              aria-label="贪吃蛇游戏区域"
            ></canvas>
            <div class="arena-overlay" id="arena-overlay">
              <div class="overlay-icon" aria-hidden="true"><span></span><span></span><span></span></div>
              <p class="overlay-kicker" id="overlay-kicker">SNAKE 01</p>
              <h2 id="overlay-title">准备好了吗？</h2>
              <p id="overlay-copy">使用方向键、WASD 或触屏按钮控制方向</p>
              <button class="button button--primary overlay-button" id="overlay-action" type="button">
                开始游戏 <span aria-hidden="true">↗</span>
              </button>
            </div>
          </div>

          <div class="mobile-scorebar" aria-label="移动端游戏状态">
            <span>得分 <strong id="mobile-score">00</strong></span>
            <span>最佳 <strong id="mobile-best">00</strong></span>
            <button id="mobile-pause" type="button">开始</button>
          </div>

          <div class="touch-controls" aria-label="触屏方向控制">
            <span></span>
            <button type="button" data-direction="up" aria-label="向上">↑</button>
            <span></span>
            <button type="button" data-direction="left" aria-label="向左">←</button>
            <button type="button" data-direction="down" aria-label="向下">↓</button>
            <button type="button" data-direction="right" aria-label="向右">→</button>
          </div>
        </div>
      </section>

      <footer class="footer" id="publication-footer">
        <div class="byline">作者：<b>辛海洋</b></div>
        <div class="pubdate">发布日期：<time datetime="2026-08-09">2026-08-09</time></div>
      </footer>
    </main>

    <script type="module" src="./game.js?v=0.1.0"></script>
  </body>
</html>
